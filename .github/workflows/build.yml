name: Release builds

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Build release client
        run: cargo build --release --bin mc112-client

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.12.2-windows
          path: target/release/mc112-client.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libvulkan-dev libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release client
        run: cargo build --release --bin mc112-client

      - name: Upload Linux client
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.12.2-linux
          path: target/release/mc112-client
          if-no-files-found: error
