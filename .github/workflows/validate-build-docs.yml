name: Build workflow validation

on:
  push:
    branches:
      - maintenance/cross-platform-build

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate expected build files
        run: |
          test -f .github/workflows/build.yml
          test -f BUILDING.md
          grep -q "build-windows" .github/workflows/build.yml
          grep -q "build-linux" .github/workflows/build.yml
