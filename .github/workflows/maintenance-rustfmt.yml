name: One-shot rustfmt cleanup

on:
  push:
    branches:
      - maintenance/rustfmt-cleanup

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: maintenance/rustfmt-cleanup
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        shell: pwsh
        run: cargo fmt --all

      - name: Commit formatting
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --all
            git commit -m "style: apply rustfmt"
            git push origin HEAD:maintenance/rustfmt-cleanup
          } else {
            Write-Host "No formatting changes required."
          }
