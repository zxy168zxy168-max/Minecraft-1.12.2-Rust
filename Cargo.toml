[package]
name = "minecraft-1-12-2-rust-vulkan"
version = "0.127.0"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"
default-run = "mc112-client"

[lib]
name = "minecraft_1_12_2_rust_vulkan"
path = "src/lib.rs"

[[bin]]
name = "mc112-client"
path = "src/main.rs"

[[bin]]
name = "validate-assets"
path = "src/bin/validate-assets.rs"

[dependencies]
base64 = "0.22"
aes = "0.8"
cipher = "0.4"
num-bigint = "0.4"
rand = "0.8"
rayon = "1.10"
rustc-hash = "2.1"
rsa = "0.9"
ureq = { version = "2.12", features = ["json", "cookies"] }
url = "2.5"
anyhow = "1.0"
ash = { version = "0.38", default-features = false, features = ["linked", "debug"] }
ash-window = "0.13"
bitflags = "2.6"
byteorder = "1.5"
bytes = "1.7"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
flate2 = "1.0"
gl = "0.14"
glutin = "0.32.3"
glutin-winit = "0.5.0"
idna = "1.0"
log = "0.4"
once_cell = "1.20"
png = "0.17"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = { version = "0.10", features = ["oid"] }
thiserror = "2.0"
uuid = { version = "1.10", features = ["serde"] }
walkdir = "2.5"
winit = "0.30"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
rodio = { version = "0.17.3", default-features = false, features = ["vorbis"] }

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[build-dependencies]
shaderc = "=0.8.3"
